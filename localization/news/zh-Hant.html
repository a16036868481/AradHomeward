<div class="brand">阿拉德·歸途</div>
<h1>歡迎回來</h1>
<p>帳號和角色進度儲存在這台電腦。</p>
<dl>
<dt>進城後</dt><dd>預設按 I 開啟背包，按 N 查看城鎮地圖。</dd>
<dt>編輯角色</dt><dd>在城鎮用修改器選取目前的角色，再調整屬性與道具。</dd>
<dt>儲存並離開</dt><dd>點「結束遊戲」，修改器會隨遊戲關閉，存檔會自動備份。</dd>
</dl>

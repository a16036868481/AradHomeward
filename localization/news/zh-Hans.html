<div class="brand">阿拉德·归途</div>
<h1>欢迎回来</h1>
<p>账号和角色进度保存在此电脑。</p>
<dl>
<dt>进城后</dt><dd>默认按 I 看背包，按 N 看城镇地图。</dd>
